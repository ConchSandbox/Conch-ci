name: Prepare Self-hosted Runner

on:
  workflow_dispatch:
    inputs:
      runner_arch:
        description: Runner architecture to prepare (all prepares both)
        required: true
        type: choice
        default: all
        options:
          - all
          - ARM64
          - X64
      mode:
        description: Read-only verification or installation
        required: true
        type: choice
        default: verify
        options:
          - verify
          - ensure
  push:
    branches:
      - main
    paths:
      - runner-env.lock.yaml
      - scripts/runner-env/**
      - .github/actions/ensure-runner-environment/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Verifies the locked persistent runner environment on request, or installs
  # and repairs it only for an explicit ensure run or a reviewed main change.
  prepare:
    name: ${{ github.event_name == 'push' && 'Ensure' || inputs.mode }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["ARM64","X64"]' || inputs.runner_arch == 'ARM64' && '["ARM64"]' || inputs.runner_arch == 'X64' && '["X64"]' || '["ARM64","X64"]') }}
    runs-on: [self-hosted, Linux, Huawei, "${{ matrix.arch }}"]
    timeout-minutes: 60
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Verify runner environment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: verify

      - name: Install locked runner environment
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ensure') }}
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: ensure
