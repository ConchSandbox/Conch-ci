name: Weekly E2B Template
run-name: weekly-e2b-template-${{ github.event.inputs.conch_ref || vars.CONCH_E2B_TEMPLATE_REF || vars.CONCH_REF || 'dev' }}

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      conch_repository:
        description: Trusted Conch source repository
        required: false
        type: choice
        options:
          - https://atomgit.com/openeuler/Conch.git
          - https://github.com/ConchSandbox/Conch.git
        default: https://atomgit.com/openeuler/Conch.git
      conch_ref:
        description: Conch ref resolved once to an immutable commit
        required: false
        default: dev
      publish_to_ghcr:
        description: Also publish the immutable rootfs and template images to GHCR
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CONCH_REPOSITORY: ${{ github.event.inputs.conch_repository || vars.CONCH_REPOSITORY || 'https://atomgit.com/openeuler/Conch.git' }}
  CONCH_REF: ${{ github.event.inputs.conch_ref || vars.CONCH_E2B_TEMPLATE_REF || vars.CONCH_REF || 'dev' }}

jobs:
  # Pins the configured Conch ref to one full commit for all produced images.
  resolve-conch:
    name: Resolve Conch commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      conch-commit: ${{ steps.resolve.outputs.conch-commit }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0
      - name: Resolve immutable Conch commit
        id: resolve
        run: |
          scripts/runner-env/jobs/resolve-conch-commit.sh \
            --repository "$CONCH_REPOSITORY" \
            --ref "$CONCH_REF"

  # Builds or restores the content-addressed ARM64 kernel required by the E2B
  # template image.
  build-kernel:
    name: Build or reuse ARM64 kernel
    needs: resolve-conch
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    outputs:
      kernel-sha256: ${{ steps.kernel.outputs.kernel-sha256 }}
      kernel-artifact-name: ${{ steps.kernel.outputs.kernel-artifact-name }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse ARM64 kernel
        id: kernel
        uses: ./.github/actions/build-kernel
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}

  # Builds or reuses immutable E2B rootfs and template images from the resolved
  # Conch commit and kernel artifact.
  build-template:
    name: Build or reuse E2B template
    needs: [resolve-conch, build-kernel]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      rootfs-image-ref: ${{ steps.template.outputs.rootfs-image-ref }}
      rootfs-build-id: ${{ steps.template.outputs.rootfs-build-id }}
      template-image-ref: ${{ steps.template.outputs.template-image-ref }}
      template-build-id: ${{ steps.template.outputs.template-build-id }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse E2B template
        id: template
        uses: ./.github/actions/build-conch-template
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}
          kernel-artifact-name: ${{ needs.build-kernel.outputs.kernel-artifact-name }}
          kernel-sha256: ${{ needs.build-kernel.outputs.kernel-sha256 }}
          dockerfile: examples/e2b-rootfs/Dockerfile
          image-profile: e2b

  # Optionally mirrors the immutable rootfs and template images to GHCR when a
  # manual run explicitly requests publication.
  publish-ghcr:
    name: Publish E2B images to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr }}
    needs: [resolve-conch, build-template]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Publish rootfs and template to GHCR
        uses: ./.github/actions/publish-conch-template
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}
          image-profile: e2b
          rootfs-image-ref: ${{ needs.build-template.outputs.rootfs-image-ref }}
          rootfs-build-id: ${{ needs.build-template.outputs.rootfs-build-id }}
          template-image-ref: ${{ needs.build-template.outputs.template-image-ref }}
          template-build-id: ${{ needs.build-template.outputs.template-build-id }}
