name: Template and Image Integration
run-name: template-image-${{ github.event.inputs.conch_ref || vars.CONCH_REF || 'dev' }}

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      conch_repository:
        description: Trusted Conch source repository
        required: false
        type: choice
        options:
          - https://atomgit.com/openeuler/Conch.git
          - https://github.com/ConchSandbox/Conch.git
          - https://github.com/SToPire/Conch.git
        default: https://atomgit.com/openeuler/Conch.git
      conch_pr_number:
        description: Pull request number in the selected Conch repository
        required: false
        type: string
      conch_ref:
        description: Conch source ref used when no pull request number is set
        required: false
        default: dev

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CONCH_REPOSITORY: ${{ github.event.inputs.conch_repository || vars.CONCH_REPOSITORY || 'https://atomgit.com/openeuler/Conch.git' }}
  CONCH_PR_NUMBER: ${{ github.event.inputs.conch_pr_number }}
  CONCH_REF: ${{ github.event.inputs.conch_ref || vars.CONCH_REF || 'dev' }}
  CONCH_API_TIMEOUT: 90m

jobs:
  resolve-conch:
    name: Resolve Conch commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      conch-commit: ${{ steps.resolve.outputs.conch-commit }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Resolve immutable Conch commit
        id: resolve
        run: |
          set -euo pipefail
          resolve_args=(--repository "$CONCH_REPOSITORY")
          if [[ -n "$CONCH_PR_NUMBER" ]]; then
            resolve_args+=(--pr-number "$CONCH_PR_NUMBER")
          else
            resolve_args+=(--ref "$CONCH_REF")
          fi
          scripts/runner-env/jobs/resolve-conch-commit.sh "${resolve_args[@]}"

  build-kernel:
    name: Build or reuse ARM64 kernel
    needs: resolve-conch
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    outputs:
      kernel-sha256: ${{ steps.kernel.outputs.kernel-sha256 }}
      kernel-artifact-name: ${{ steps.kernel.outputs.kernel-artifact-name }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse ARM64 kernel
        id: kernel
        uses: ./.github/actions/build-kernel
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}

  build-fixtures:
    name: Build or reuse Template/Image fixtures
    needs: [resolve-conch, build-kernel]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 240
    concurrency:
      group: conch-ci-conchd-runtime
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      rootfs-image-ref: ${{ steps.fixtures.outputs.rootfs-image-ref }}
      template-image-ref: ${{ steps.fixtures.outputs.template-image-ref }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse integration fixtures
        id: fixtures
        uses: ./.github/actions/build-conch-template
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}
          kernel-artifact-name: ${{ needs.build-kernel.outputs.kernel-artifact-name }}
          kernel-sha256: ${{ needs.build-kernel.outputs.kernel-sha256 }}
          dockerfile: examples/e2b-rootfs/Dockerfile
          image-profile: template-image-it

  integration:
    name: Template/Image black-box lifecycle
    needs: [resolve-conch, build-fixtures]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 60
    concurrency:
      group: conch-ci-conchd-runtime
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Verify runner environment
        id: runner-environment
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: verify

      - name: Checkout immutable Conch source
        run: |
          scripts/runner-env/jobs/checkout-conch.sh \
            --repository "$CONCH_REPOSITORY" \
            --commit "${{ needs.resolve-conch.outputs.conch-commit }}" \
            --destination "$RUNNER_TEMP/conch-template-image-integration-source"

      - name: Build Conch binaries
        uses: ./.github/actions/build-conch
        with:
          conch-source: ${{ runner.temp }}/conch-template-image-integration-source

      - name: Start isolated conchd
        id: conchd
        uses: ./.github/actions/start-conchd
        with:
          conch-source: ${{ runner.temp }}/conch-template-image-integration-source
          binary-dir: ${{ steps.runner-environment.outputs.binary-dir }}
          runtime-name: conch-template-image-integration
          app-name: conch-template-image-integration
          log-level: debug
          api-timeout: ${{ env.CONCH_API_TIMEOUT }}

      - name: Run Template/Image P0 integration suite
        env:
          CONCH_SOURCE: ${{ runner.temp }}/conch-template-image-integration-source
          CONCH_CONFIG: ${{ steps.conchd.outputs.config }}
          CONCH_UNIX_SOCKET: ${{ steps.conchd.outputs.unix-socket }}
          ROOTFS_IMAGE_REF: ${{ needs.build-fixtures.outputs.rootfs-image-ref }}
          TEMPLATE_IMAGE_REF: ${{ needs.build-fixtures.outputs.template-image-ref }}
          TEST_ARTIFACT_DIR: ${{ runner.temp }}/conch-template-image-integration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 45m \
            python3 -u scripts/workflows/template-image-integration/run.py \
              --conch-source "$CONCH_SOURCE" \
              --config "$CONCH_CONFIG" \
              --unix-socket "$CONCH_UNIX_SOCKET" \
              --rootfs-image-ref "$ROOTFS_IMAGE_REF" \
              --template-image-ref "$TEMPLATE_IMAGE_REF" \
              --artifact-dir "$TEST_ARTIFACT_DIR"

      - name: Dump conchd diagnostics on failure
        if: failure()
        env:
          CONCHD_WORK_DIR: ${{ steps.conchd.outputs.work-dir }}
        run: |
          set +e
          if [[ -n "${CONCHD_WORK_DIR:-}" && -f "$CONCHD_WORK_DIR/conchd.log" ]]; then
            sed -n '1,800p' "$CONCHD_WORK_DIR/conchd.log"
          fi

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: template-image-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/conch-template-image-integration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/conch-template-image-integration-${{ github.run_id }}-${{ github.run_attempt }}/conchd.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean Conch runtime
        if: always()
        uses: ./.github/actions/cleanup-conch-runtime
        with:
          runtime-name: conch-template-image-integration
          binary-dir: ${{ steps.runner-environment.outputs.binary-dir }}

      - name: Clean integration files
        if: always()
        run: |
          set +e
          for path in \
            "$RUNNER_TEMP/conch-template-image-integration-source" \
            "$RUNNER_TEMP/conch-template-image-integration-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            [[ -z "$path" || ! -e "$path" ]] || sudo -n find "$path" -depth -delete
          done
          exit 0
