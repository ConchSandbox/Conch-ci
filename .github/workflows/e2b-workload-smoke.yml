name: E2B Workload End-to-End
run-name: ${{ github.event.inputs.conch_pr_number || github.event.inputs.conch_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      conch_repository:
        description: Trusted Conch source repository
        required: false
        type: choice
        options:
          - https://atomgit.com/openeuler/Conch.git
          - https://github.com/ConchSandbox/Conch.git
        default: https://atomgit.com/openeuler/Conch.git
      conch_pr_number:
        description: Pull request number in the selected Conch repository
        required: false
        type: string
      conch_ref:
        description: Conch source ref used when no pull request number is set
        required: false
        default: dev
      run_sdk_smoke:
        description: Run SDK connectivity and network-policy jobs
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CONCH_REPOSITORY: ${{ github.event.inputs.conch_repository || vars.CONCH_REPOSITORY || 'https://atomgit.com/openeuler/Conch.git' }}
  CONCH_PR_NUMBER: ${{ github.event.inputs.conch_pr_number }}
  CONCH_REF: ${{ github.event.inputs.conch_ref || vars.CONCH_REF || 'dev' }}
  CONCH_API_TIMEOUT: 90m
  CONCH_E2B_DNS_NAMESERVER: "223.5.5.5"
  CONCH_E2B_NETWORK_TEST_URL: https://example.com/
  CONCH_E2B_SDK_HTTP_TIMEOUT: "300"
  CONCH_NETWORK_TEST_ALLOW_IP: 198.18.0.1
  CONCH_NETWORK_TEST_DENY_IP: 198.18.0.2
  GOPROXY: https://goproxy.cn

jobs:
  # Pins the requested branch or pull request to one full commit so all E2B
  # jobs validate the same immutable Conch source.
  resolve-conch:
    name: Resolve Conch commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      conch-commit: ${{ steps.resolve.outputs.conch-commit }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0
      - name: Resolve immutable Conch commit
        id: resolve
        run: |
          set -euo pipefail
          resolve_args=(--repository "$CONCH_REPOSITORY")
          if [[ -n "$CONCH_PR_NUMBER" ]]; then
            resolve_args+=(--pr-number "$CONCH_PR_NUMBER")
          else
            resolve_args+=(--ref "$CONCH_REF")
          fi
          scripts/runner-env/jobs/resolve-conch-commit.sh "${resolve_args[@]}"

  # Builds or restores the content-addressed ARM64 kernel required by the E2B
  # template consumed later in this workflow.
  build-kernel:
    name: Build or reuse ARM64 kernel
    needs: resolve-conch
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    outputs:
      kernel-sha256: ${{ steps.kernel.outputs.kernel-sha256 }}
      kernel-artifact-name: ${{ steps.kernel.outputs.kernel-artifact-name }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse ARM64 kernel
        id: kernel
        uses: ./.github/actions/build-kernel
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}

  # Builds or reuses an immutable E2B template from the resolved Conch commit
  # and kernel artifact, then exports its digest reference to consumer jobs.
  build-template:
    name: Build or reuse E2B template
    needs: [resolve-conch, build-kernel]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 240
    concurrency:
      group: conch-ci-conchd-socket
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      template-image-ref: ${{ steps.template.outputs.template-image-ref }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse E2B template
        id: template
        uses: ./.github/actions/build-conch-template
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}
          kernel-artifact-name: ${{ needs.build-kernel.outputs.kernel-artifact-name }}
          kernel-sha256: ${{ needs.build-kernel.outputs.kernel-sha256 }}
          dockerfile: examples/e2b-rootfs/Dockerfile
          image-profile: e2b

  # Exercises an E2B sandbox without a network policy through the current SDK,
  # covering guest commands, DNS, outbound routing, inbound access, and delete.
  sdk-connectivity:
    name: E2B SDK and Guest Connectivity
    needs: [resolve-conch, build-template]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 150
    concurrency:
      group: conch-ci-conchd-socket
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Verify runner environment
        id: runner-environment
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: verify

      - name: Checkout immutable Conch source
        run: |
          scripts/runner-env/jobs/checkout-conch.sh \
            --repository "$CONCH_REPOSITORY" \
            --commit "${{ needs.resolve-conch.outputs.conch-commit }}" \
            --destination "$RUNNER_TEMP/conch-e2b-sdk-source"

      - name: Prepare Conch SDK
        id: sdk
        uses: ./.github/actions/prepare-conch-sdk
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-sdk-source
          venv: ${{ runner.temp }}/conch-e2b-sdk-venv
          requirements: scripts/workflows/e2b-workload-smoke/requirements.lock.txt

      - name: Build Conch binaries
        uses: ./.github/actions/build-conch
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-sdk-source

      - name: Configure E2B CNI DNS
        env:
          CNI_CONFIG: ${{ runner.temp }}/conch-e2b-sdk-source/config/cni/net.d/10-conch.conf
        run: |
          set -euo pipefail
          python3 scripts/workflows/e2b-workload-smoke/sdk-connectivity/configure-cni-dns.py \
            --config "$CNI_CONFIG" \
            --nameserver "$CONCH_E2B_DNS_NAMESERVER"

      - name: Start isolated conchd
        id: conchd
        uses: ./.github/actions/start-conchd
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-sdk-source
          binary-dir: ${{ steps.runner-environment.outputs.binary-dir }}
          runtime-name: conch-e2b-sdk
          app-name: conch-e2b-sdk
          log-level: debug
          api-timeout: ${{ env.CONCH_API_TIMEOUT }}

      - name: Pull runner-local Conch template
        id: template
        uses: ./.github/actions/pull-conch-template
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-sdk-source
          config: ${{ steps.conchd.outputs.config }}
          template-image-ref: ${{ needs.build-template.outputs.template-image-ref }}
          image-profile: e2b

      - name: Validate E2B SDK and guest connectivity
        id: sdk_validation
        if: ${{ github.event.inputs.run_sdk_smoke != 'false' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/conch-e2b-sdk-source
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCH_SANDBOX_ID: sandbox_e2b_sdk_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_TEMPLATE_ID: ${{ steps.template.outputs.template-id }}
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 15m \
            "$CONCH_SDK_PYTHON" -u \
              "$GITHUB_WORKSPACE/scripts/workflows/e2b-workload-smoke/sdk-connectivity/smoke.py"

      - name: Dump conchd and network diagnostics on failure
        if: failure()
        env:
          START_CONCHD_WORK_DIR: ${{ steps.conchd.outputs.work-dir }}
        run: |
          set +e
          START_CONCHD_WORK_DIR=${START_CONCHD_WORK_DIR:-$RUNNER_TEMP/conch-e2b-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}
          [[ ! -f "$START_CONCHD_WORK_DIR/conchd.log" ]] || \
            sed -n '1,600p' "$START_CONCHD_WORK_DIR/conchd.log"
          sudo -n ip addr show
          sudo -n ip route show
          sudo -n ip netns list
          sudo -n iptables -t nat -S

      - name: Best-effort delete E2B sandbox after failure
        if: ${{ always() && github.event.inputs.run_sdk_smoke != 'false' && steps.sdk_validation.outcome != 'success' }}
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCH_SANDBOX_ID: sandbox_e2b_sdk_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set +e
          if [[ -n "${CONCH_SDK_PYTHON:-}" && -x "$CONCH_SDK_PYTHON" ]]; then
            "$CONCH_SDK_PYTHON" - <<'PY'
          import os
          import time
          from conch import Sandbox
          base_sandbox_id = os.environ.get("CONCH_SANDBOX_ID", "")
          sandbox_ids = [
              base_sandbox_id,
              f"{base_sandbox_id}_invalid_env",
              f"{base_sandbox_id}_oversized_env",
          ] if base_sandbox_id else []
          for sandbox_id in sandbox_ids:
              try:
                  Sandbox.delete_sandbox(sandbox_id)
                  time.sleep(5)
              except Exception as exc:
                  if "Sandbox not found" in str(exc):
                      print(f"sandbox already absent: {sandbox_id}")
                  else:
                      print(f"warning: sandbox cleanup failed for {sandbox_id}: {exc}")
          PY
          fi
          exit 0

      - name: Clean Conch runtime
        if: always()
        uses: ./.github/actions/cleanup-conch-runtime
        with:
          runtime-name: conch-e2b-sdk

      - name: Clean workload files
        if: always()
        run: |
          set +e
          for path in \
            "$RUNNER_TEMP/conch-e2b-sdk-source" \
            "$RUNNER_TEMP/conch-e2b-sdk-venv"; do
            [[ -z "$path" || ! -e "$path" ]] || sudo -n find "$path" -depth -delete
          done
          exit 0

  # Validates network-policy lifecycle behavior and proves a reused network
  # slot cannot inherit stale conntrack state from the previous sandbox.
  network-policy:
    name: Network Policy
    if: ${{ github.event.inputs.run_sdk_smoke != 'false' }}
    needs: [resolve-conch, build-template, sdk-connectivity]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 150
    concurrency:
      group: conch-ci-conchd-socket
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Verify runner environment
        id: runner-environment
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: verify

      - name: Checkout immutable Conch source
        run: |
          scripts/runner-env/jobs/checkout-conch.sh \
            --repository "$CONCH_REPOSITORY" \
            --commit "${{ needs.resolve-conch.outputs.conch-commit }}" \
            --destination "$RUNNER_TEMP/conch-e2b-network-policy-source"

      - name: Prepare Conch SDK
        id: sdk
        uses: ./.github/actions/prepare-conch-sdk
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-network-policy-source
          venv: ${{ runner.temp }}/conch-e2b-network-policy-sdk-venv
          requirements: scripts/workflows/e2b-workload-smoke/requirements.lock.txt

      - name: Build Conch binaries
        uses: ./.github/actions/build-conch
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-network-policy-source

      - name: Prepare controlled CNI tools
        id: cni-tools
        env:
          MANAGED_BINARY_DIR: ${{ steps.runner-environment.outputs.binary-dir }}
        run: |
          set -euo pipefail
          admin_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          sudo -n env PATH="$admin_path" sh -c 'command -v nsenter >/dev/null'
          tools_dir="$RUNNER_TEMP/conch-e2b-network-policy-cni-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control_dir="$tools_dir/control"
          real_bridge="$MANAGED_BINARY_DIR/cni/bridge"
          [[ -f "$real_bridge" && -x "$real_bridge" ]]
          mkdir -p "$tools_dir/cni" "$control_dir"
          for plugin in "$MANAGED_BINARY_DIR/cni/"*; do
            [[ -f "$plugin" && -x "$plugin" ]] || continue
            [[ "$(basename "$plugin")" != bridge ]] || continue
            ln -s "$plugin" "$tools_dir/cni/$(basename "$plugin")"
          done
          ln -s "$MANAGED_BINARY_DIR/cloud-hypervisor" "$tools_dir/cloud-hypervisor"
          install -m 0755 \
            scripts/workflows/e2b-workload-smoke/network-policy/cni-refill-control.py \
            "$tools_dir/cni/bridge"
          {
            echo "binary-dir=$tools_dir"
            echo "control-dir=$control_dir"
            echo "real-bridge=$real_bridge"
          } >> "$GITHUB_OUTPUT"

      - name: Configure controlled CNI network
        env:
          CNI_CONFIG: ${{ runner.temp }}/conch-e2b-network-policy-source/config/cni/net.d/10-conch.conf
          CNI_CONTROL_DIR: ${{ steps.cni-tools.outputs.control-dir }}
          CNI_REAL_BRIDGE: ${{ steps.cni-tools.outputs.real-bridge }}
        run: |
          set -euo pipefail
          python3 scripts/workflows/e2b-workload-smoke/network-policy/configure-cni.py \
            --config "$CNI_CONFIG" \
            --nameserver "$CONCH_E2B_DNS_NAMESERVER" \
            --control-dir "$CNI_CONTROL_DIR" \
            --real-bridge "$CNI_REAL_BRIDGE"

      - name: Start isolated conchd
        id: conchd
        uses: ./.github/actions/start-conchd
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-network-policy-source
          binary-dir: ${{ steps.cni-tools.outputs.binary-dir }}
          runtime-name: conch-e2b-network-policy
          app-name: conch-e2b-network-policy
          log-level: debug
          api-timeout: ${{ env.CONCH_API_TIMEOUT }}

      - name: Pull runner-local Conch template
        id: template
        uses: ./.github/actions/pull-conch-template
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-network-policy-source
          config: ${{ steps.conchd.outputs.config }}
          template-image-ref: ${{ needs.build-template.outputs.template-image-ref }}
          image-profile: e2b

      - name: Allow sandbox requests to runner test server
        env:
          FIREWALL_STATE: ${{ runner.temp }}/conch-e2b-network-policy-firewall-${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          install -m 0600 /dev/null "$FIREWALL_STATE"
          if ! command -v firewall-cmd >/dev/null 2>&1 || \
            ! sudo -n firewall-cmd --state >/dev/null 2>&1; then
            echo inactive > "$FIREWALL_STATE"
            exit 0
          fi

          sudo -n ip link show dev cni-conch0 >/dev/null
          previous_zone=$(sudo -n firewall-cmd \
            --get-zone-of-interface=cni-conch0 2>/dev/null || true)
          if [[ -z "$previous_zone" || "$previous_zone" == "no zone" ]]; then
            echo unassigned > "$FIREWALL_STATE"
          else
            [[ "$previous_zone" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]
            printf 'zone:%s\n' "$previous_zone" > "$FIREWALL_STATE"
          fi
          sudo -n firewall-cmd --zone=trusted --change-interface=cni-conch0

      - name: Validate network policies and cross-sandbox slot reuse
        timeout-minutes: 25
        working-directory: ${{ runner.temp }}/conch-e2b-network-policy-source
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCH_SANDBOX_ID: sandbox_network_policy_a_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_REUSE_SANDBOX_ID: sandbox_network_policy_b_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_TEMPLATE_ID: ${{ steps.template.outputs.template-id }}
          CONCH_CNI_CONTROL_DIR: ${{ steps.cni-tools.outputs.control-dir }}
        run: |
          set -euo pipefail
          loopback_state="$RUNNER_TEMP/conch-e2b-network-policy-loopback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          install -m 0600 /dev/null "$loopback_state"
          for address in "$CONCH_NETWORK_TEST_ALLOW_IP" "$CONCH_NETWORK_TEST_DENY_IP"; do
            if sudo -n ip -o -4 address show dev lo | \
              awk -v cidr="$address/32" '$4 == cidr { found = 1 } END { exit !found }'; then
              echo "preserving pre-existing loopback address: $address/32"
            else
              sudo -n ip address add "$address/32" dev lo
              printf '%s\n' "$address" >> "$loopback_state"
            fi
          done
          timeout --foreground --kill-after=30s 20m \
            "$CONCH_SDK_PYTHON" -u \
              "$GITHUB_WORKSPACE/scripts/workflows/e2b-workload-smoke/network-policy/validate-network-policy-and-slot-reuse.py"

      - name: Dump conchd and network diagnostics on failure
        if: failure()
        env:
          START_CONCHD_WORK_DIR: ${{ steps.conchd.outputs.work-dir }}
        run: |
          set +e
          START_CONCHD_WORK_DIR=${START_CONCHD_WORK_DIR:-$RUNNER_TEMP/conch-e2b-network-policy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}
          [[ ! -f "$START_CONCHD_WORK_DIR/conchd.log" ]] || \
            sed -n '1,600p' "$START_CONCHD_WORK_DIR/conchd.log"
          sudo -n ip addr show
          sudo -n ip route show
          sudo -n ip netns list
          sudo -n iptables -t nat -S

      - name: Release blocked CNI refill
        if: always()
        env:
          CNI_CONTROL_DIR: ${{ steps.cni-tools.outputs.control-dir }}
        run: |
          set +e
          [[ -z "${CNI_CONTROL_DIR:-}" || ! -d "$CNI_CONTROL_DIR" ]] || \
            touch "$CNI_CONTROL_DIR/release-refill"
          exit 0

      - name: Restore runner firewall
        if: always()
        env:
          FIREWALL_STATE: ${{ runner.temp }}/conch-e2b-network-policy-firewall-${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set +e
          [[ -f "$FIREWALL_STATE" ]] || exit 0
          firewall_state=$(<"$FIREWALL_STATE")
          if ! command -v firewall-cmd >/dev/null 2>&1 || \
            ! sudo -n firewall-cmd --state >/dev/null 2>&1; then
            exit 0
          fi
          case "$firewall_state" in
            inactive)
              ;;
            unassigned)
              sudo -n firewall-cmd \
                --zone=trusted --remove-interface=cni-conch0 || true
              ;;
            zone:*)
              previous_zone=${firewall_state#zone:}
              if [[ "$previous_zone" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
                sudo -n firewall-cmd \
                  --zone="$previous_zone" --change-interface=cni-conch0 || true
              fi
              ;;
          esac
          exit 0

      - name: Delete network-policy sandboxes
        if: always()
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCH_SANDBOX_ID: sandbox_network_policy_a_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_REUSE_SANDBOX_ID: sandbox_network_policy_b_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set +e
          if [[ -n "${CONCH_SDK_PYTHON:-}" && -x "$CONCH_SDK_PYTHON" ]]; then
            for sandbox_id in "$CONCH_SANDBOX_ID" "$CONCH_REUSE_SANDBOX_ID"; do
              [[ -n "$sandbox_id" ]] || continue
              timeout --foreground --kill-after=5s 60s \
                "$CONCH_SDK_PYTHON" - "$sandbox_id" <<'PY'
          import sys
          import time
          from conch import Sandbox
          sandbox_id = sys.argv[1]
          try:
              Sandbox.delete_sandbox(sandbox_id)
              time.sleep(5)
          except Exception as exc:
              print(f"warning: sandbox cleanup failed for {sandbox_id}: {exc}")
          PY
              status=$?
              if (( status != 0 )); then
                echo "warning: sandbox cleanup timed out or failed for $sandbox_id (exit=$status)"
              fi
            done
          fi
          exit 0

      - name: Clean Conch runtime
        if: always()
        uses: ./.github/actions/cleanup-conch-runtime
        with:
          runtime-name: conch-e2b-network-policy

      - name: Clean network-policy files
        if: always()
        run: |
          set +e
          loopback_state="$RUNNER_TEMP/conch-e2b-network-policy-loopback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          if [[ -f "$loopback_state" ]]; then
            while IFS= read -r address; do
              case "$address" in
                "$CONCH_NETWORK_TEST_ALLOW_IP"|"$CONCH_NETWORK_TEST_DENY_IP")
                  sudo -n ip address delete "$address/32" dev lo >/dev/null 2>&1 || true
                  ;;
              esac
            done < "$loopback_state"
          fi
          for path in \
            "$RUNNER_TEMP/conch-e2b-network-policy-cni-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$loopback_state" \
            "$RUNNER_TEMP/conch-e2b-network-policy-firewall-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" \
            "$RUNNER_TEMP/conch-e2b-network-policy-source" \
            "$RUNNER_TEMP/conch-e2b-network-policy-sdk-venv"; do
            [[ -z "$path" || ! -e "$path" ]] || sudo -n find "$path" -depth -delete
          done
          exit 0
