name: E2B Workload Smoke
run-name: ${{ github.event.inputs.conch_pr_number || github.event.inputs.conch_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      conch_repository:
        description: Trusted Conch source repository
        required: false
        type: choice
        options:
          - https://atomgit.com/openeuler/Conch.git
          - https://github.com/ConchSandbox/Conch.git
        default: https://atomgit.com/openeuler/Conch.git
      conch_pr_number:
        description: Pull request number in the selected Conch repository
        required: false
        type: string
      conch_ref:
        description: Conch source ref used when no pull request number is set
        required: false
        default: dev
      run_sdk_smoke:
        description: Run E2B SDK operations after pulling the published template
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CONCH_REPOSITORY: ${{ github.event.inputs.conch_repository || vars.CONCH_REPOSITORY || 'https://atomgit.com/openeuler/Conch.git' }}
  CONCH_PR_NUMBER: ${{ github.event.inputs.conch_pr_number }}
  CONCH_REF: ${{ github.event.inputs.conch_ref || vars.CONCH_REF || 'dev' }}
  CONCH_API_TIMEOUT: 90m
  CONCH_E2B_SDK_HTTP_TIMEOUT: "300"
  GOPROXY: https://goproxy.cn

jobs:
  resolve-conch:
    name: Resolve Conch commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      conch-commit: ${{ steps.resolve.outputs.conch-commit }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0
      - name: Resolve immutable Conch commit
        id: resolve
        run: |
          set -euo pipefail
          resolve_args=(--repository "$CONCH_REPOSITORY")
          if [[ -n "$CONCH_PR_NUMBER" ]]; then
            resolve_args+=(--pr-number "$CONCH_PR_NUMBER")
          else
            resolve_args+=(--ref "$CONCH_REF")
          fi
          scripts/runner-env/jobs/resolve-conch-commit.sh "${resolve_args[@]}"

  build-kernel:
    name: Build or reuse ARM64 kernel
    needs: resolve-conch
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    outputs:
      kernel-sha256: ${{ steps.kernel.outputs.kernel-sha256 }}
      kernel-artifact-name: ${{ steps.kernel.outputs.kernel-artifact-name }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse ARM64 kernel
        id: kernel
        uses: ./.github/actions/build-kernel
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}

  build-template:
    name: Build or reuse E2B template
    needs: [resolve-conch, build-kernel]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      template-image-ref: ${{ steps.template.outputs.template-image-ref }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Build or reuse E2B template
        id: template
        uses: ./.github/actions/build-conch-template
        with:
          conch-repository: ${{ env.CONCH_REPOSITORY }}
          conch-commit: ${{ needs.resolve-conch.outputs.conch-commit }}
          kernel-artifact-name: ${{ needs.build-kernel.outputs.kernel-artifact-name }}
          kernel-sha256: ${{ needs.build-kernel.outputs.kernel-sha256 }}
          dockerfile: examples/e2b-rootfs/Dockerfile
          image-profile: e2b

  workload-smoke:
    name: E2B Workload Smoke
    needs: [resolve-conch, build-template]
    runs-on: [self-hosted, Linux, ARM64, Huawei]
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4.4.0

      - name: Verify runner environment
        id: runner-environment
        uses: ./.github/actions/ensure-runner-environment
        with:
          mode: verify

      - name: Checkout immutable Conch source
        run: |
          scripts/runner-env/jobs/checkout-conch.sh \
            --repository "$CONCH_REPOSITORY" \
            --commit "${{ needs.resolve-conch.outputs.conch-commit }}" \
            --destination "$RUNNER_TEMP/conch-e2b-workload-source"

      - name: Prepare Conch SDK
        id: sdk
        uses: ./.github/actions/prepare-conch-sdk
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-workload-source
          venv: ${{ runner.temp }}/conch-e2b-workload-sdk-venv
          requirements: scripts/workflows/e2b-workload-smoke/requirements.lock.txt

      - name: Build Conch binaries
        uses: ./.github/actions/build-conch
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-workload-source

      - name: Start isolated conchd
        id: conchd
        uses: ./.github/actions/start-conchd
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-workload-source
          binary-dir: ${{ steps.runner-environment.outputs.binary-dir }}
          runtime-name: conch-e2b-workload
          app-name: conch-e2b-workload
          log-level: debug
          api-timeout: ${{ env.CONCH_API_TIMEOUT }}

      - name: Pull runner-local Conch template
        id: template
        uses: ./.github/actions/pull-conch-template
        with:
          conch-source: ${{ runner.temp }}/conch-e2b-workload-source
          config: ${{ steps.conchd.outputs.config }}
          namespace: ${{ steps.conchd.outputs.namespace }}
          template-image-ref: ${{ needs.build-template.outputs.template-image-ref }}
          image-profile: e2b

      - name: Boot sandbox and validate E2B SDK operations
        if: ${{ github.event.inputs.run_sdk_smoke != 'false' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/conch-e2b-workload-source
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCHD_API_URL: ${{ steps.conchd.outputs.api-url }}
          CONCH_NAMESPACE: ${{ steps.conchd.outputs.namespace }}
          CONCH_SANDBOX_ID: sandbox_e2b_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_SDK_CONFIG: ${{ runner.temp }}/conch-e2b-workload-source/config/sdk-config.yaml
          CONCH_TEMPLATE_ID: ${{ steps.template.outputs.template-id }}
        run: |
          timeout --foreground --kill-after=30s 15m \
            "$CONCH_SDK_PYTHON" -u \
              "$GITHUB_WORKSPACE/scripts/workflows/e2b-workload-smoke/e2b-sdk-smoke.py"

      - name: Dump conchd and network diagnostics on failure
        if: failure()
        env:
          START_CONCHD_WORK_DIR: ${{ steps.conchd.outputs.work-dir }}
        run: |
          set +e
          START_CONCHD_WORK_DIR=${START_CONCHD_WORK_DIR:-$RUNNER_TEMP/conch-e2b-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}
          [[ ! -f "$START_CONCHD_WORK_DIR/conchd.log" ]] || \
            sed -n '1,600p' "$START_CONCHD_WORK_DIR/conchd.log"
          sudo -n ip addr show
          sudo -n ip route show
          sudo -n ip netns list
          sudo -n iptables -t nat -S

      - name: Delete E2B sandbox
        if: ${{ always() && github.event.inputs.run_sdk_smoke != 'false' }}
        env:
          CONCH_SDK_PYTHON: ${{ steps.sdk.outputs.python }}
          CONCHD_API_URL: ${{ steps.conchd.outputs.api-url }}
          CONCH_NAMESPACE: ${{ steps.conchd.outputs.namespace }}
          CONCH_SANDBOX_ID: sandbox_e2b_${{ github.run_id }}_${{ github.run_attempt }}
          CONCH_SDK_CONFIG: ${{ runner.temp }}/conch-e2b-workload-source/config/sdk-config.yaml
        run: |
          set +e
          if [[ -n "${CONCH_SDK_PYTHON:-}" && -x "$CONCH_SDK_PYTHON" && -n "${CONCH_SDK_CONFIG:-}" ]]; then
            "$CONCH_SDK_PYTHON" - <<'PY'
          import os
          import time
          from conch import Sandbox
          sandbox_id = os.environ.get("CONCH_SANDBOX_ID", "")
          if sandbox_id:
              try:
                  Sandbox.delete_sandbox(
                      sandbox_id,
                      unix_socket="",
                      api_url=os.environ["CONCHD_API_URL"],
                      config_path=os.environ["CONCH_SDK_CONFIG"],
                      namespace=os.environ.get("CONCH_NAMESPACE") or None,
                  )
                  time.sleep(5)
              except Exception as exc:
                  print(f"warning: sandbox cleanup failed: {exc}")
          PY
          fi
          exit 0

      - name: Clean Conch runtime
        if: always()
        uses: ./.github/actions/cleanup-conch-runtime
        with:
          runtime-name: conch-e2b-workload

      - name: Clean workload files
        if: always()
        run: |
          set +e
          for path in \
            "$RUNNER_TEMP/conch-e2b-workload-source" \
            "$RUNNER_TEMP/conch-e2b-workload-sdk-venv"; do
            [[ -z "$path" || ! -e "$path" ]] || sudo -n find "$path" -depth -delete
          done
          exit 0
