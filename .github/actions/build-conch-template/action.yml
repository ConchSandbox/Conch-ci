name: Build Conch template
description: Build, reuse, and publish a parameterized Conch template

inputs:
  conch-repository:
    description: Trusted Conch source repository URL
    required: false
    default: https://atomgit.com/openeuler/Conch.git
  conch-commit:
    description: Immutable Conch commit to build
    required: true
  kernel-artifact-name:
    description: Kernel workflow artifact name
    required: true
  kernel-sha256:
    description: Expected kernel image SHA-256
    required: true
  dockerfile:
    description: Conch-repository-relative Dockerfile used to build the rootfs
    required: true
  image-profile:
    description: Workflow-owned lowercase profile used in local OCI repository names
    required: true

outputs:
  rootfs-image-ref:
    description: Immutable rootfs reference in the runner-local OCI registry
    value: ${{ steps.rootfs.outputs.rootfs-image-ref }}
  rootfs-build-id:
    description: Deterministic rootfs build ID
    value: ${{ steps.rootfs.outputs.rootfs-build-id }}
  template-image-ref:
    description: Immutable template reference in the runner-local OCI registry
    value: ${{ steps.template.outputs.template-image-ref }}
  template-build-id:
    description: Deterministic template build ID
    value: ${{ steps.template-plan.outputs.template-build-id }}

runs:
  using: composite
  steps:
    - name: Verify runner environment
      id: runner-environment
      uses: ./.github/actions/ensure-runner-environment
      with:
        mode: verify

    - name: Resolve local OCI repositories
      id: repositories
      shell: bash
      env:
        IMAGE_PROFILE: ${{ inputs.image-profile }}
      run: |
        "$GITHUB_WORKSPACE/scripts/runner-env/lib/image_repositories.sh" \
          "$IMAGE_PROFILE" >> "$GITHUB_OUTPUT"

    - name: Checkout immutable Conch source
      shell: bash
      env:
        CONCH_REPOSITORY: ${{ inputs.conch-repository }}
      run: |
        scripts/runner-env/jobs/checkout-conch.sh \
          --repository "$CONCH_REPOSITORY" \
          --commit "${{ inputs.conch-commit }}" \
          --destination "$RUNNER_TEMP/conch-template-source"

    - name: Build or reuse rootfs image
      id: rootfs
      shell: bash
      env:
        CONCH_REPOSITORY: ${{ inputs.conch-repository }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        ROOTFS_REPOSITORY: ${{ steps.repositories.outputs.local-rootfs-repository }}
      run: |
        scripts/runner-env/jobs/ensure-rootfs.sh \
          --conch-source "$RUNNER_TEMP/conch-template-source" \
          --conch-commit "${{ inputs.conch-commit }}" \
          --source-repository "$CONCH_REPOSITORY" \
          --dockerfile "$DOCKERFILE" \
          --repository "$ROOTFS_REPOSITORY" \
          --bin-dir "${{ steps.runner-environment.outputs.binary-dir }}" \
          --work-dir "$RUNNER_TEMP/conch-template-rootfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

    - name: Resolve template cache key
      id: template-plan
      shell: bash
      env:
        CONCH_COMMIT: ${{ inputs.conch-commit }}
        KERNEL_SHA256: ${{ inputs.kernel-sha256 }}
        ROOTFS_IMAGE_REF: ${{ steps.rootfs.outputs.rootfs-image-ref }}
        TEMPLATE_REPOSITORY: ${{ steps.repositories.outputs.local-template-repository }}
      run: |
        [[ "$CONCH_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        [[ "$KERNEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
        [[ "$ROOTFS_IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
        [[ "$TEMPLATE_REPOSITORY" =~ ^localhost:5000/conch-ci/conch-[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?-template$ ]]
        recipe_sha256=$(
          {
            sha256sum "$GITHUB_ACTION_PATH/action.yml" | awk '{print $1}'
            sha256sum "$GITHUB_WORKSPACE/.github/actions/build-conch/action.yml" | awk '{print $1}'
            sha256sum "$GITHUB_WORKSPACE/.github/actions/build-conch-initramfs/action.yml" | awk '{print $1}'
            sha256sum "$GITHUB_WORKSPACE/.github/actions/start-conchd/action.yml" | awk '{print $1}'
            printf 'go-toolchain=%s\n' "$(python3 scripts/runner-env/lib/lock.py \
              get job_build_inputs.go_toolchain.version)"
          } | sha256sum | awk '{print $1}'
        )
        template_build_id=$(
          printf '%s\n' \
            "schema=1" \
            "conch-commit=$CONCH_COMMIT" \
            "rootfs-image=$ROOTFS_IMAGE_REF" \
            "kernel-sha256=$KERNEL_SHA256" \
            "recipe-sha256=$recipe_sha256" |
            sha256sum | awk '{print $1}'
        )
        template_tag="$TEMPLATE_REPOSITORY:build-$template_build_id"
        template_image_ref=
        cache_hit=false
        if template_digest=$("$GITHUB_ACTION_PATH/inspect-template.sh" "$template_tag" 2>/dev/null); then
          template_image_ref="$TEMPLATE_REPOSITORY@$template_digest"
          cache_hit=true
        fi
        {
          echo "template-build-id=$template_build_id"
          echo "template-tag=$template_tag"
          echo "template-image-ref=$template_image_ref"
          echo "cache-hit=$cache_hit"
        } >> "$GITHUB_OUTPUT"
        printf 'template build ID: %s\n' "$template_build_id"
        printf 'template cache hit: %s\n' "$cache_hit"

    - name: Build Conch binaries
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      uses: ./.github/actions/build-conch
      with:
        conch-source: ${{ runner.temp }}/conch-template-source

    - name: Download kernel artifact
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      uses: actions/download-artifact@v4.3.0
      with:
        name: ${{ inputs.kernel-artifact-name }}
        path: ${{ runner.temp }}/conch-template-kernel/${{ inputs.kernel-artifact-name }}

    - name: Validate downloaded kernel
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        KERNEL_ARTIFACT_NAME: ${{ inputs.kernel-artifact-name }}
        KERNEL_SHA256: ${{ inputs.kernel-sha256 }}
      run: |
        [[ "$KERNEL_ARTIFACT_NAME" =~ ^kernel-arm64-[0-9a-f]{64}$ ]]
        scripts/runner-env/jobs/build-kernel.sh ensure \
          --conch-source "$RUNNER_TEMP/conch-template-source" \
          --conch-commit "${{ inputs.conch-commit }}" \
          --cache-root "$RUNNER_TEMP/conch-template-kernel" \
          --cache-hit true
        kernel_path="$RUNNER_TEMP/conch-template-kernel/$KERNEL_ARTIFACT_NAME/bzImage"
        [[ "$(sha256sum "$kernel_path" | awk '{print $1}')" == "$KERNEL_SHA256" ]]
        echo "CONCH_TEMPLATE_KERNEL_PATH=$kernel_path" >> "$GITHUB_ENV"

    - name: Build minimal Conch initramfs
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      uses: ./.github/actions/build-conch-initramfs
      with:
        conch-source: ${{ runner.temp }}/conch-template-source
        output: ${{ runner.temp }}/conch-template-initramfs-${{ github.run_id }}-${{ github.run_attempt }}/conch-init-initramfs.cpio.gz
        work-dir: ${{ runner.temp }}/conch-template-initramfs-${{ github.run_id }}-${{ github.run_attempt }}/work

    - name: Start isolated conchd
      id: conchd
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      uses: ./.github/actions/start-conchd
      with:
        conch-source: ${{ runner.temp }}/conch-template-source
        binary-dir: ${{ steps.runner-environment.outputs.binary-dir }}
        runtime-name: conch-template
        app-name: conch-template-builder

    - name: Create and publish Conch template
      if: ${{ steps.template-plan.outputs.cache-hit != 'true' }}
      id: template-publish
      shell: bash
      working-directory: ${{ runner.temp }}/conch-template-source
      env:
        CONCH_API_TIMEOUT: 90m
        ROOTFS_IMAGE_REF: ${{ steps.rootfs.outputs.rootfs-image-ref }}
        TEMPLATE_BUILD_ID: ${{ steps.template-plan.outputs.template-build-id }}
        TEMPLATE_TAG: ${{ steps.template-plan.outputs.template-tag }}
        CONCH_TEMPLATE_CONFIG: ${{ steps.conchd.outputs.config }}
        CONCH_TEMPLATE_INITRD: ${{ runner.temp }}/conch-template-initramfs-${{ github.run_id }}-${{ github.run_attempt }}/conch-init-initramfs.cpio.gz
      run: |
        local_tag="localhost/conch/template:build-$TEMPLATE_BUILD_ID"
        create_output=$(./bin/conch template create \
          --config "$CONCH_TEMPLATE_CONFIG" \
          --source "$ROOTFS_IMAGE_REF" \
          --kernel "$CONCH_TEMPLATE_KERNEL_PATH" \
          --initrd "$CONCH_TEMPLATE_INITRD" \
          -t "$local_tag" \
          --plain-http)
        printf '%s\n' "$create_output"
        template_id=$(awk '$1 == "Template:" {print $2; exit}' <<<"$create_output")
        local_digest=$(awk '$1 == "Image" && $2 == "digest:" {print $3; exit}' <<<"$create_output")
        [[ "$template_id" =~ ^tmpl_[[:alnum:]]+$ ]]
        [[ "$local_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        ./bin/conch template push \
          --config "$CONCH_TEMPLATE_CONFIG" \
          --plain-http \
          --timeout 60m \
          "$template_id" "$TEMPLATE_TAG"
        remote_digest=$("$GITHUB_ACTION_PATH/inspect-template.sh" "$TEMPLATE_TAG")
        [[ "$remote_digest" == "$local_digest" ]]
        template_repository=${TEMPLATE_TAG%:*}
        echo "template-image-ref=$template_repository@$remote_digest" >> "$GITHUB_OUTPUT"

    - name: Resolve immutable template reference
      id: template
      shell: bash
      env:
        CACHE_HIT: ${{ steps.template-plan.outputs.cache-hit }}
        CACHED_IMAGE_REF: ${{ steps.template-plan.outputs.template-image-ref }}
        PUBLISHED_IMAGE_REF: ${{ steps.template-publish.outputs.template-image-ref }}
        TEMPLATE_REPOSITORY: ${{ steps.repositories.outputs.local-template-repository }}
      run: |
        if [[ "$CACHE_HIT" == true ]]; then
          template_image_ref=$CACHED_IMAGE_REF
        else
          template_image_ref=$PUBLISHED_IMAGE_REF
        fi
        template_digest=${template_image_ref#"$TEMPLATE_REPOSITORY@"}
        [[ "$template_image_ref" == "$TEMPLATE_REPOSITORY@$template_digest" ]]
        [[ "$template_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "template-image-ref=$template_image_ref" >> "$GITHUB_OUTPUT"
        printf 'Conch template: %s\n' "$template_image_ref"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "### Conch template"
            echo
            echo "- Build ID: \`${{ steps.template-plan.outputs.template-build-id }}\`"
            echo "- Cache hit: \`$CACHE_HIT\`"
            echo "- Image: \`$template_image_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Dump template builder diagnostics
      if: failure()
      shell: bash
      env:
        CONCHD_WORK_DIR: ${{ steps.conchd.outputs.work-dir }}
      run: |
        set +e
        conchd_work_dir=${CONCHD_WORK_DIR:-$RUNNER_TEMP/conch-template-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}
        if [[ -f "$conchd_work_dir/conchd.log" ]]; then
          sed -n '1,600p' "$conchd_work_dir/conchd.log"
        fi

    - name: Clean Conch runtime
      if: always()
      uses: ./.github/actions/cleanup-conch-runtime
      with:
        runtime-name: conch-template

    - name: Clean template producer files
      if: always()
      shell: bash
      run: |
        set +e
        for path in \
          "$RUNNER_TEMP/conch-template-source" \
          "$RUNNER_TEMP/conch-template-initramfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          "$RUNNER_TEMP/conch-template-kernel" \
          "$RUNNER_TEMP/conch-template-rootfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
          [[ -z "$path" || ! -e "$path" ]] || sudo -n find "$path" -depth -delete
        done
