name: Start isolated conchd
description: Create an isolated runtime, start conchd, and wait for its API

inputs:
  conch-source:
    description: Checked-out Conch source directory containing bin/conchd
    required: true
  binary-dir:
    description: Runner binary directory containing CNI plugins
    required: true
  runtime-name:
    description: Name used for the job-local runtime directory
    required: true
  app-name:
    description: Application name written to the conchd configuration
    required: true
  log-level:
    description: conchd log level
    required: false
    default: info
  api-timeout:
    description: Conch API timeout passed to conchd
    required: false
    default: 90m
  reuse-runtime:
    description: Reuse the existing job-local config and state instead of preparing a new runtime
    required: false
    default: "false"
  log-file:
    description: Basename of the conchd log file written below the runtime directory
    required: false
    default: conchd.log

outputs:
  work-dir:
    description: Isolated conchd runtime directory
    value: ${{ steps.runtime.outputs.work-dir }}
  config:
    description: Generated conchd configuration path
    value: ${{ steps.runtime.outputs.config }}
  unix-socket:
    description: Unix socket conchd serves its API on
    value: ${{ steps.runtime.outputs.unix-socket }}

runs:
  using: composite
  steps:
    - name: Prepare isolated conchd runtime
      id: runtime
      shell: bash
      env:
        CONCH_SOURCE: ${{ inputs.conch-source }}
        BINARY_DIR: ${{ inputs.binary-dir }}
        RUNTIME_NAME: ${{ inputs.runtime-name }}
        APP_NAME: ${{ inputs.app-name }}
        LOG_LEVEL: ${{ inputs.log-level }}
        REUSE_RUNTIME: ${{ inputs.reuse-runtime }}
      run: |
        set -euo pipefail
        [[ "$CONCH_SOURCE" == /* && -x "$CONCH_SOURCE/bin/conchd" ]]
        [[ "$BINARY_DIR" == /* && -x "$BINARY_DIR/cni/bridge" ]]
        [[ "$RUNTIME_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]
        [[ "$APP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
        [[ "$LOG_LEVEL" =~ ^(debug|info|warn|error)$ ]]
        [[ "$REUSE_RUNTIME" =~ ^(true|false)$ ]]

        workdir="$RUNNER_TEMP/$RUNTIME_NAME-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        config="$workdir/config.yaml"
        server_work_dir="$workdir/work"
        state_dir="$workdir/state"
        cni_conf_dir="$workdir/cni/net.d"
        unix_socket="$server_work_dir/conchd.sock"
        if ((${#unix_socket} >= 108)); then
          echo "derived conchd socket path is too long: $unix_socket" >&2
          exit 1
        fi

        # A runner interruption can skip every later `if: always()` cleanup
        # step. Recover only fixed resources whose old RUNNER_TEMP owner is
        # unambiguous and has no live conchd before claiming them for this run.
        for path in /etc/conch /etc/conch/cni /etc/conch/cni/net.d /var/run/conch; do
          if sudo -n test -L "$path"; then
            echo "refusing unsafe Conch fixed path: $path" >&2
            exit 1
          fi
        done
        recovery_report="$RUNNER_TEMP/$RUNTIME_NAME-abandoned-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
        if [[ -e "$recovery_report" || -L "$recovery_report" ]]; then
          echo "refusing to replace existing abandoned-runtime report: $recovery_report" >&2
          exit 1
        fi
        set +e
        sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 \
          "$GITHUB_ACTION_PATH/../cleanup-conch-runtime/cleanup.py" \
          abandoned-run \
          --runner-temp "$RUNNER_TEMP" \
          --current-work-dir "$workdir" \
          --binary-dir "$BINARY_DIR" \
          --report-file "$recovery_report"
        recovery_status=$?
        set -e
        if ((recovery_status == 43)); then
          if [[ ! -f "$recovery_report" || -L "$recovery_report" ]]; then
            echo "abandoned runtime was recovered without a safe report" >&2
            exit 1
          fi
          sudo -n cat -- "$recovery_report" | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
          sudo -n unlink -- "$recovery_report"
        elif ((recovery_status != 0)); then
          if [[ -f "$recovery_report" && ! -L "$recovery_report" ]]; then
            sudo -n cat -- "$recovery_report" | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null || true
          fi
          echo "abandoned Conch runtime recovery failed" >&2
          exit "$recovery_status"
        elif [[ -e "$recovery_report" || -L "$recovery_report" ]]; then
          echo "unexpected abandoned-runtime report without recovered resources" >&2
          exit 1
        fi

        if [[ "$REUSE_RUNTIME" == true ]]; then
          require_runtime_file() {
            local path=$1
            local description=$2
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "cannot reuse conchd runtime: $description is missing or unsafe: $path" >&2
              exit 1
            fi
          }
          if [[ ! -d "$workdir" || -L "$workdir" ]]; then
            echo "cannot reuse conchd runtime: work directory is missing or unsafe: $workdir" >&2
            exit 1
          fi
          require_runtime_file "$config" "config"
          require_runtime_file "$state_dir/state.db" "state database"
          require_runtime_file "$cni_conf_dir/.conch-ci-runtime" "CNI runtime marker"
        else
          [[ ! -e "$workdir" ]] || sudo -n find "$workdir" -depth -delete
          mkdir -p "$server_work_dir" "$state_dir" "$cni_conf_dir"
          install -m 0644 "$CONCH_SOURCE/config/cni/net.d/"*.conf "$cni_conf_dir/"
          printf '%s\n' "$workdir" > "$cni_conf_dir/.conch-ci-runtime"

          cat > "$config" <<YAML
        app:
          name: $APP_NAME
        log:
          level: $LOG_LEVEL
          output: stdout
        server:
          work_dir: "$server_work_dir"
          state_dir: "$state_dir"
        network:
          warm_pool_size: 1
          cni:
            plugin_bin_dirs:
              - "$BINARY_DIR/cni"
        sandbox:
          backend: cloud-hypervisor
          vsock_signal_retry: 10ms
          vsock_signal_timeout: 90s
          request_timeout: 120s
          default_spec:
            template_name: ""
            template_id: ""
            vcpu_num: 2
            vcpu_max: 2
            ram_mb: 2048
          cloud_hypervisor:
            binary: "$BINARY_DIR/cloud-hypervisor"
        YAML
          chmod 0600 "$config"
        fi

        # Conch loads CNI configuration from this fixed system path. Bind the
        # job-local directory over it so existing host configuration is hidden,
        # not overwritten. Calling jobs serialize this shared mount and SDK alias.
        sudo -n mkdir -p /etc/conch/cni/net.d
        if mountpoint -q /etc/conch/cni/net.d; then
          if ! sudo -n test "$cni_conf_dir/.conch-ci-runtime" -ef \
              /etc/conch/cni/net.d/.conch-ci-runtime; then
            echo "/etc/conch/cni/net.d is mounted by another runtime" >&2
            exit 1
          fi
        else
          sudo -n mount --bind "$cni_conf_dir" /etc/conch/cni/net.d
        fi

        # The Python SDK uses the default socket path directly. Keep conchd's
        # derived socket job-local and expose only a checked symlink at that path.
        sdk_socket_dir=/var/run/conch
        sdk_socket="$sdk_socket_dir/conchd.sock"
        sudo -n install -d -m 0755 "$sdk_socket_dir"
        if sudo -n test -e "$sdk_socket" || sudo -n test -L "$sdk_socket"; then
          if ! sudo -n test -L "$sdk_socket" || \
              [[ $(sudo -n readlink -- "$sdk_socket") != "$unix_socket" ]]; then
            echo "$sdk_socket belongs to another runtime" >&2
            exit 1
          fi
        else
          sudo -n ln -s -- "$unix_socket" "$sdk_socket"
        fi

        {
          echo "work-dir=$workdir"
          echo "config=$config"
          echo "unix-socket=$unix_socket"
        } >> "$GITHUB_OUTPUT"

    - name: Start conchd and wait for API
      shell: bash
      working-directory: ${{ inputs.conch-source }}
      env:
        API_TIMEOUT: ${{ inputs.api-timeout }}
        UNIX_SOCKET: ${{ steps.runtime.outputs.unix-socket }}
        CONFIG: ${{ steps.runtime.outputs.config }}
        WORK_DIR: ${{ steps.runtime.outputs.work-dir }}
        LOG_FILE: ${{ inputs.log-file }}
      run: |
        set -euo pipefail
        [[ "$LOG_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.log$ ]]
        log_path="$WORK_DIR/$LOG_FILE"
        for pid_file in "$WORK_DIR/conchd.pid" "$WORK_DIR/work/conchd.pid"; do
          if [[ -f "$pid_file" ]]; then
            old_pid=$(<"$pid_file")
            if [[ "$old_pid" =~ ^[0-9]+$ ]] && sudo -n kill -0 "$old_pid" 2>/dev/null; then
              echo "refusing to replace live process $old_pid from $pid_file" >&2
              exit 1
            fi
          fi
          [[ ! -e "$pid_file" && ! -L "$pid_file" ]] || sudo -n unlink -- "$pid_file"
        done
        # Refuse to replace a live daemon even if stale runtime files survived.
        if sudo -n curl --unix-socket "$UNIX_SOCKET" -fsS -o /dev/null "http://localhost/health" 2>/dev/null; then
          echo "another conchd is already serving $UNIX_SOCKET; refusing to start" >&2
          exit 1
        fi
        fail_startup() {
          sed -n '1,400p' "$log_path" >&2 || true
          for pid_file in "$WORK_DIR/conchd.pid" "$WORK_DIR/work/conchd.pid"; do
            if [[ -f "$pid_file" ]]; then
              sudo -n kill "$(<"$pid_file")" >/dev/null 2>&1 || true
            fi
          done
          exit 1
        }

        runtime_path="$PATH:/usr/local/sbin:/usr/sbin:/sbin"
        sudo -n sh -c 'exec env PATH="$1" HOME="$2" CONCH_API_TIMEOUT="$3" ./bin/conchd -config "$4" > "$5" 2>&1' \
          sh "$runtime_path" "$HOME" "$API_TIMEOUT" "$CONFIG" "$log_path" &
        echo "$!" > "$WORK_DIR/conchd.pid"

        for _ in $(seq 1 120); do
          if sudo -n curl --unix-socket "$UNIX_SOCKET" -fsS -X POST "http://localhost/api/template/list" \
            -H 'Content-Type: application/json' \
            -d '{}' >/dev/null 2>&1; then
            # conchd runs under sudo, so the socket lands as 0660 root:root. Hand it
            # to the runner's group; the SDK and CLI run unprivileged.
            sudo -n chgrp "$(id -gn)" "$UNIX_SOCKET"
            sudo -n chmod 0660 "$UNIX_SOCKET"
            exit 0
          fi
          sudo -n kill -0 "$(<"$WORK_DIR/conchd.pid")" 2>/dev/null || {
            fail_startup
          }
          sleep 1
        done
        fail_startup
