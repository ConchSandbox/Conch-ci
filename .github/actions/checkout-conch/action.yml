name: Checkout immutable Conch source
description: Checkout a trusted Conch repository at one immutable commit

inputs:
  repository:
    description: Trusted Conch source repository URL
    required: true
  commit:
    description: Immutable full Conch commit
    required: true
  destination:
    description: Absolute checkout destination
    required: true

runs:
  using: composite
  steps:
    - name: Checkout immutable Conch source
      shell: bash
      env:
        CONCH_REPOSITORY: ${{ inputs.repository }}
        CONCH_COMMIT: ${{ inputs.commit }}
        CONCH_DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        if [[ "$CONCH_REPOSITORY" != https://github.com/SToPire/Conch.git ]]; then
          scripts/runner-env/jobs/checkout-conch.sh \
            --repository "$CONCH_REPOSITORY" \
            --commit "$CONCH_COMMIT" \
            --destination "$CONCH_DESTINATION"
          exit 0
        fi

        [[ "$CONCH_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        [[ "$CONCH_DESTINATION" == /* && "$CONCH_DESTINATION" != / && ! -L "$CONCH_DESTINATION" ]]
        cleanup_destination() {
          if [[ -e "$CONCH_DESTINATION" ]]; then
            find "$CONCH_DESTINATION" -depth -delete
          fi
        }
        checkout_complete=false
        trap '[[ "$checkout_complete" == true ]] || cleanup_destination' EXIT
        fetch_complete=false
        for attempt in 1 2 3; do
          cleanup_destination
          mkdir -p "$CONCH_DESTINATION"
          git -C "$CONCH_DESTINATION" init -q
          git -C "$CONCH_DESTINATION" remote add origin "$CONCH_REPOSITORY"
          printf 'fetching trusted fork commit (attempt %d/3): %s\n' \
            "$attempt" "$CONCH_COMMIT"
          if git \
            -c http.version=HTTP/1.1 \
            -c http.lowSpeedLimit=1024 \
            -c http.lowSpeedTime=60 \
            -C "$CONCH_DESTINATION" \
            fetch --no-tags --depth 1 origin "$CONCH_COMMIT"; then
            fetch_complete=true
            break
          fi
        done
        [[ "$fetch_complete" == true ]]
        git -C "$CONCH_DESTINATION" checkout --detach "$CONCH_COMMIT"
        [[ "$(git -C "$CONCH_DESTINATION" rev-parse HEAD)" == "$CONCH_COMMIT" ]]
        git -C "$CONCH_DESTINATION" status --short --branch
        checkout_complete=true
        trap - EXIT
