name: Pull Conch template
description: Pull an immutable runner-local Conch template and verify its digest

inputs:
  conch-source:
    description: Checked-out Conch source directory containing bin/conch
    required: true
  config:
    description: conch configuration path
    required: true
  template-image-ref:
    description: Immutable runner-local template reference
    required: true
  image-profile:
    description: Workflow-owned lowercase profile used in local OCI repository names
    required: true

outputs:
  template-id:
    description: ID of the locally pulled template
    value: ${{ steps.pull.outputs.template-id }}

runs:
  using: composite
  steps:
    - name: Resolve local OCI repositories
      id: repositories
      shell: bash
      env:
        IMAGE_PROFILE: ${{ inputs.image-profile }}
      run: |
        "$GITHUB_WORKSPACE/scripts/runner-env/lib/image_repositories.sh" \
          "$IMAGE_PROFILE" >> "$GITHUB_OUTPUT"

    - name: Pull and verify runner-local Conch template
      id: pull
      shell: bash
      working-directory: ${{ inputs.conch-source }}
      env:
        CONCH_CONFIG: ${{ inputs.config }}
        TEMPLATE_IMAGE_REF: ${{ inputs.template-image-ref }}
        TEMPLATE_REPOSITORY: ${{ steps.repositories.outputs.local-template-repository }}
      run: |
        set -euo pipefail
        [[ -x bin/conch ]]
        [[ -f "$CONCH_CONFIG" ]]
        template_digest=${TEMPLATE_IMAGE_REF#"$TEMPLATE_REPOSITORY@"}
        [[ "$TEMPLATE_IMAGE_REF" == "$TEMPLATE_REPOSITORY@$template_digest" ]]
        [[ "$template_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

        pull_output=$(./bin/conch template pull \
          --config "$CONCH_CONFIG" \
          --plain-http \
          "$TEMPLATE_IMAGE_REF")
        printf '%s\n' "$pull_output"

        template_id=$(awk '$1 == "Template" && $2 == "ID:" {print $3; exit}' \
          <<<"$pull_output")
        [[ "$template_id" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$template_id" == "$template_digest" ]]
        echo "template-id=$template_id" >> "$GITHUB_OUTPUT"
